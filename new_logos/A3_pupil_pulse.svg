<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <linearGradient id="goldLens" x1="100" y1="165" x2="412" y2="347" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="50%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="goldPupil" x1="234" y1="234" x2="278" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="50%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Signal rings -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#goldLens)" stroke-width="1.5" opacity="0.10"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldLens)" stroke-width="1.5" opacity="0.07"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldLens)" stroke-width="1.5" opacity="0.04"/>

  <!-- Eye lens -->
  <path d="M 100,256 C 165,165 347,165 412,256 C 347,347 165,347 100,256 Z"
        fill="none" stroke="url(#goldLens)" stroke-width="6" stroke-linecap="round"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="72" fill="#0A0B12"/>

  <!-- White ring -->
  <circle cx="256" cy="256" r="55" fill="none" stroke="#FFFFFF" stroke-width="7"/>

  <!-- Gold pupil -->
  <circle cx="256" cy="256" r="22" fill="url(#goldPupil)"/>
</svg>
