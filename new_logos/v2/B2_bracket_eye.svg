<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="b2bg" cx="50%" cy="42%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <linearGradient id="b2gold" x1="108" y1="148" x2="404" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="52%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="b2glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#b2bg)"/>

  <!-- glow under brackets -->
  <g stroke="url(#b2gold)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#b2glow)">
    <line x1="108" y1="148" x2="152" y2="148"/>
    <line x1="108" y1="364" x2="152" y2="364"/>
    <line x1="108" y1="148" x2="108" y2="364"/>
    <line x1="404" y1="148" x2="360" y2="148"/>
    <line x1="404" y1="364" x2="360" y2="364"/>
    <line x1="404" y1="148" x2="404" y2="364"/>
  </g>

  <!-- left bracket [ -->
  <g stroke="url(#b2gold)" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="108" y1="148" x2="152" y2="148"/>
    <line x1="108" y1="364" x2="152" y2="364"/>
    <line x1="108" y1="148" x2="108" y2="364"/>
  </g>

  <!-- right bracket ] -->
  <g stroke="url(#b2gold)" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="404" y1="148" x2="360" y2="148"/>
    <line x1="404" y1="364" x2="360" y2="364"/>
    <line x1="404" y1="148" x2="404" y2="364"/>
  </g>

  <!-- white eye -->
  <path d="M 172,256 C 206,210 306,210 340,256 C 306,302 206,302 172,256 Z"
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- dark iris -->
  <circle cx="256" cy="256" r="42" fill="#0A0B12"/>
  <!-- gold pupil accent -->
  <circle cx="256" cy="256" r="16" fill="url(#b2gold)"/>
</svg>
