<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <linearGradient id="goldBlade" x1="150" y1="150" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="50%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="apGlow" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FED23A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FED23A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft outer glow -->
  <circle cx="256" cy="256" r="150" fill="url(#apGlow)"/>

  <!-- 6 aperture blades. Each blade is a curved quadrilateral:
       a wide arc along the rim, a straight inner chord forming the
       hexagonal opening, with dark gaps between adjacent blades so
       the iris-blade structure reads clearly. Base blade spans the
       top sector centred on 12 o'clock; rotated by 60 deg each. -->
  <g fill="url(#goldBlade)">
    <path d="M 200.5,145.8
             A 124,124 0 0 1 311.5,145.8
             L 230.5,225
             Z" transform="rotate(0 256 256)"/>
    <path d="M 200.5,145.8
             A 124,124 0 0 1 311.5,145.8
             L 230.5,225
             Z" transform="rotate(60 256 256)"/>
    <path d="M 200.5,145.8
             A 124,124 0 0 1 311.5,145.8
             L 230.5,225
             Z" transform="rotate(120 256 256)"/>
    <path d="M 200.5,145.8
             A 124,124 0 0 1 311.5,145.8
             L 230.5,225
             Z" transform="rotate(180 256 256)"/>
    <path d="M 200.5,145.8
             A 124,124 0 0 1 311.5,145.8
             L 230.5,225
             Z" transform="rotate(240 256 256)"/>
    <path d="M 200.5,145.8
             A 124,124 0 0 1 311.5,145.8
             L 230.5,225
             Z" transform="rotate(300 256 256)"/>
  </g>

  <!-- Centre opening -->
  <circle cx="256" cy="256" r="34" fill="#0A0B12"/>

  <!-- White dot -->
  <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
</svg>
