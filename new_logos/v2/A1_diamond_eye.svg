<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <linearGradient id="goldDiamond" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="50%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Diamond glow (behind) -->
  <polygon points="256,80 432,256 256,432 80,256" fill="none"
           stroke="url(#goldDiamond)" stroke-width="4" stroke-linejoin="miter"
           opacity="0.4" filter="url(#glow)"/>

  <!-- Diamond frame -->
  <polygon points="256,80 432,256 256,432 80,256" fill="none"
           stroke="url(#goldDiamond)" stroke-width="4" stroke-linejoin="miter"/>

  <!-- Eye lens (white) -->
  <path d="M 175,256 C 210,205 302,205 337,256 C 302,307 210,307 175,256 Z"
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="46" fill="#0A0B12"/>

  <!-- Pupil ring (white) -->
  <circle cx="256" cy="256" r="34" fill="none" stroke="#FFFFFF" stroke-width="7"/>

  <!-- Inner pupil -->
  <circle cx="256" cy="256" r="14" fill="#0A0B12"/>
</svg>
