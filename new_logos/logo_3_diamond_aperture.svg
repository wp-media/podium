<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <!-- bevel: bright upper-left, deep lower-right -->
    <linearGradient id="diamond3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFE27A"/>
      <stop offset="35%"  stop-color="#FED23A"/>
      <stop offset="70%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7E1C"/>
    </linearGradient>
    <filter id="dglow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>

  <!-- diamond glow copy behind -->
  <polygon points="256,88 424,256 256,424 88,256"
           fill="none" stroke="url(#diamond3)" stroke-width="3"
           stroke-linejoin="miter" opacity="0.3" filter="url(#dglow3)"/>

  <!-- gold diamond frame -->
  <polygon points="256,88 424,256 256,424 88,256"
           fill="none" stroke="url(#diamond3)" stroke-width="3"
           stroke-linejoin="miter" stroke-linecap="round"/>

  <!-- inner white ascending-signal glyph -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <line x1="256" y1="312" x2="256" y2="232" stroke-width="1.5"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="256" cy="312" r="4"/>
    <circle cx="256" cy="272" r="5"/>
    <circle cx="256" cy="232" r="6"/>
  </g>
</svg>
