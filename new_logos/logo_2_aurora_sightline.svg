<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <!-- gradient along the sweep: deep tails, bright apex -->
    <linearGradient id="ribbon2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C9A227"/>
      <stop offset="28%"  stop-color="#FED23A"/>
      <stop offset="55%"  stop-color="#FFE27A"/>
      <stop offset="80%"  stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <!-- opacity falloff at the two tails -->
    <linearGradient id="fade2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="14%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="86%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="tailmask2">
      <path d="M 96 396 C 176 348, 196 196, 256 256 C 316 316, 336 164, 416 116"
            fill="none" stroke="url(#fade2)" stroke-width="14" stroke-linecap="round"/>
    </mask>
    <filter id="bloom2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="apex2" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>

  <g mask="url(#tailmask2)">
    <!-- outer aurora bloom -->
    <path d="M 96 396 C 176 348, 196 196, 256 256 C 316 316, 336 164, 416 116"
          fill="none" stroke="url(#ribbon2)" stroke-width="9"
          stroke-linecap="round" opacity="0.3" filter="url(#bloom2)"/>
    <!-- main ribbon: thins almost to nothing at optical centre crossing -->
    <path d="M 96 396 C 176 348, 196 196, 256 256 C 316 316, 336 164, 416 116"
          fill="none" stroke="url(#ribbon2)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 96 396 C 168 352, 198 208, 248 262"
          fill="none" stroke="url(#ribbon2)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 264 250 C 320 312, 340 168, 416 116"
          fill="none" stroke="url(#ribbon2)" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- white pinprick at brightest apex (upper-right crest) -->
  <circle cx="376" cy="144" r="5" fill="#FFFFFF" opacity="0.45" filter="url(#apex2)"/>
  <circle cx="376" cy="144" r="2.2" fill="#FFFFFF"/>
</svg>
