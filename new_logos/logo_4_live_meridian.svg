<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <!-- brightest near the pulse (right of centre) -->
    <linearGradient id="line4" gradientUnits="userSpaceOnUse" x1="80" y1="256" x2="432" y2="256">
      <stop offset="0%"   stop-color="#C9A227"/>
      <stop offset="45%"  stop-color="#FED23A"/>
      <stop offset="62%"  stop-color="#FFE27A"/>
      <stop offset="80%"  stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="spike4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#FFE27A"/>
    </linearGradient>
    <filter id="lglow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tip4" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg4)"/>

  <g filter="url(#lglow4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- calm base line on each side -->
    <path d="M 80 256 L 432 256" stroke="url(#line4)" stroke-width="3"/>
    <!-- live pulse spike -->
    <path d="M 298 256 L 310 192 L 316 192 L 328 256"
          stroke="url(#spike4)" stroke-width="3"/>
  </g>

  <!-- brightest point at spike tip -->
  <circle cx="313" cy="192" r="5" fill="#FFE27A" opacity="0.5" filter="url(#tip4)"/>

  <!-- single white tick mark below the spike -->
  <line x1="313" y1="264" x2="313" y2="272"
        stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
