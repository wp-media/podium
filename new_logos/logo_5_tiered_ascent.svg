<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <linearGradient id="gold5" gradientUnits="userSpaceOnUse" x1="150" y1="278" x2="360" y2="278">
      <stop offset="0%"   stop-color="#FFE27A"/>
      <stop offset="50%"  stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <!-- additive glow that keeps the gold visible -->
    <filter id="stepglow5" x="-50%" y="-120%" width="200%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dot5" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg5)"/>

  <!-- stepped ascending edges, each lit -->
  <g filter="url(#stepglow5)" stroke="url(#gold5)" stroke-linecap="round" fill="none" stroke-width="4">
    <line x1="150" y1="310" x2="310" y2="310" opacity="0.50"/>
    <line x1="175" y1="278" x2="335" y2="278" opacity="0.75"/>
    <line x1="200" y1="246" x2="360" y2="246" opacity="1.0"/>
  </g>

  <!-- white point at top step's right end -->
  <circle cx="360" cy="246" r="6" fill="#FFFFFF" opacity="0.4" filter="url(#dot5)"/>
  <circle cx="360" cy="246" r="3" fill="#FFFFFF"/>
</svg>
