        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right brace } leg -->
  <path d="M 380,296
           C 404,304 396,332 400,348
           C 402,360 412,364 422,367
           C 412,370 402,374 400,386
           C 396,402 404,420 380,428"
        fill="none" stroke="url(#goldPodium)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold podium surface bar -->
  <line x1="135" y1="280" x2="377" y2="280"
        stroke="url(#goldPodium)" stroke-width="10" stroke-linecap="round"/>

  <!-- White upward chevron -->
