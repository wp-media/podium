<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#0A0B12"/>
    </radialGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="45%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FED23A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="glow1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotglow1" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>

  <!-- faint embossed concentric arcs fanning upward from bar centre -->
  <g fill="none" stroke="url(#arc1)" stroke-linecap="round">
    <path d="M 176 340 A 80 80 0 0 1 336 340"  stroke-width="1.2" opacity="0.08"/>
    <path d="M 126 340 A 130 130 0 0 1 386 340" stroke-width="1.2" opacity="0.07"/>
    <path d="M 71 340 A 185 185 0 0 1 441 340"  stroke-width="1.2" opacity="0.06"/>
  </g>

  <!-- gold platform bar with soft upper glow -->
  <g filter="url(#glow1)">
    <rect x="146" y="338" width="220" height="4" rx="2" fill="url(#bar1)"/>
  </g>

  <!-- white dot at bar centre -->
  <circle cx="256" cy="340" r="6" fill="#FFFFFF" opacity="0.5" filter="url(#dotglow1)"/>
  <circle cx="256" cy="340" r="3.5" fill="#FFFFFF"/>
</svg>
